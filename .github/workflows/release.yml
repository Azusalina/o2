name: Build IPA and release v1.0

on:
  push:
    tags:
      - v1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-camera-v1.0
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # An unsigned device build can be packaged without Apple credentials.
      # Sign the downloaded IPA with your sideloading tool before installation.
      - name: Compile for iPhone
        run: |
          set -euo pipefail
          xcodebuild             -project RawCamera.xcodeproj             -scheme RawCamera             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/RawCameraBuild"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/RawCameraBuild/Build/Products/Release-iphoneos/RawCamera.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/RawCamera.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" dist/RawCamera-v1.0-unsigned.ipa
          unzip -t dist/RawCamera-v1.0-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawCamera-v1.0-unsigned
          path: dist/RawCamera-v1.0-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: RawCamera-v1.0-unsigned
          path: dist

      - name: Publish v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual run may create the tag. An existing tag must identify
          # exactly the source that produced this IPA.
          if git show-ref --verify --quiet refs/tags/v1.0; then
            if [[ "$(git rev-parse 'refs/tags/v1.0^{commit}')" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::v1.0 already points to another commit. Run this workflow on the v1.0 tag."
              exit 1
            fi
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          RAW Camera v1.0 for iPhone running iOS 18 or later.

          Manual shutter speed, ISO, white balance, focus, and physical lens selection.
          Hold the shutter for RAW burst capture with continuous autofocus.
          A 30-photo buffer continuously saves DNG files to Photos.

          Download RawCamera-v1.0-unsigned.ipa and sign it using your sideloading tool before installing.
          NOTES
          # Query the list so authentication/network errors fail the step.
          release_id="$(gh release list --limit 1000 --json tagName --jq '.[] | select(.tagName == "v1.0") | .tagName')"
          if [[ -z "$release_id" ]]; then
            gh release create v1.0               --target "$(git rev-parse HEAD)"               --title "RAW Camera v1.0"               --notes-file "$RUNNER_TEMP/release-notes.md"               dist/RawCamera-v1.0-unsigned.ipa
          else
            gh release upload v1.0 dist/RawCamera-v1.0-unsigned.ipa --clobber
          fi
