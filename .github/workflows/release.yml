name: Build IPA and release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raw-camera-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: v1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check exposure priority calculations
        run: |
          set -euo pipefail
          swiftc RawCamera/Exposure.swift Tests/ExposureChecks.swift -o "$RUNNER_TEMP/ExposureChecks"
          "$RUNNER_TEMP/ExposureChecks"

      # Sign the downloaded IPA with a sideloading tool before installation.
      - name: Compile for iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project RawCamera.xcodeproj \
            -scheme RawCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RawCameraBuild" \
            MARKETING_VERSION="${RELEASE_TAG#v}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/RawCameraBuild/Build/Products/Release-iphoneos/RawCamera.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/RawCamera.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "dist/RawCamera-$RELEASE_TAG-unsigned.ipa"
          unzip -t "dist/RawCamera-$RELEASE_TAG-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RawCamera-${{ env.RELEASE_TAG }}-unsigned
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: RawCamera-${{ env.RELEASE_TAG }}-unsigned
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Release tag points to another commit."
              exit 1
            fi
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          RAW Camera for iPhone running iOS 18 or later.

          Manual, shutter-priority, and ISO-priority exposure, white balance, focus, physical lens selection, tap-to-focus, a compact live preview histogram, rotating interface, composition grids, a level, and Camera Control support.
          Hold the shutter for RAW bursts with continuous autofocus and a 30-photo buffer.

          Sign the unsigned IPA with your sideloading tool before installing.
          NOTES
          release_id="$(gh release list --limit 1000 --json tagName --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .tagName")"
          if [[ -z "$release_id" ]]; then
            gh release create "$RELEASE_TAG" \
              --target "$(git rev-parse HEAD)" \
              --title "RAW Camera $RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "dist/RawCamera-$RELEASE_TAG-unsigned.ipa"
          else
            gh release upload "$RELEASE_TAG" "dist/RawCamera-$RELEASE_TAG-unsigned.ipa" --clobber
          fi
